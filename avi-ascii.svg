    font-size: 9.0px;
    fill: #39d353;
    white-space: pre;
    opacity: 0;
    animation: ascii-type 0.35s steps(1, end) forwards;
  }
  @keyframes ascii-type {
    0% { opacity: 0; }
    1% { opacity: 1; }
    100% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ascii-row { animation: none; opacity: 1; }
  }
</style>
